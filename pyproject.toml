[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bra-audit-reconstruction"
version = "0.1.0"
description = "Transparent Table 5 reconstruction of BRA-Audit"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "PyYAML>=6,<7", "networkx>=3.3,<4"]

[project.optional-dependencies]
local = ["torch>=2.5,<3", "transformers>=4.51,<5", "accelerate>=1,<2", "huggingface-hub>=0.30,<1", "sentencepiece>=0.2", "safetensors>=0.5"]
dev = ["pytest>=8,<10"]

[project.scripts]
bra-audit = "bra_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
